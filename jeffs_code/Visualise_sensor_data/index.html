<!DOCTYPE html>
<html>
<head>
    <title>IMU & Magnetometer Data Viewer</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body { font-family: Arial; margin: 20px; background:#f0f0f0; }
        .box { background:white; padding:20px; border-radius:10px; margin-bottom:20px; }
        #plot2d, #plot3d, #track2d { width:100%; height:500px; }
        button { padding:10px; margin:5px; }
    </style>
</head>
<body>

<div class="box">
    <h2>Sensor CSV Viewer</h2>
    <input type="file" id="fileInput"><br><br>

    <button onclick="plotMag()">Magnetometer</button>
    <button onclick="plotAcc()">Acceleration</button>
    <button onclick="plotHeading()">Heading</button>
    <button onclick="plotMag3D()">3D Magnetometer</button>
    <button onclick="plotAcc3D()">3D Acceleration</button>
    <button onclick="plotTrack()">2D Track</button>
    <button onclick="plotPosition3D()">3D Position</button>
    <button onclick="applyKalmanFilter()">Kalman Filter Acceleration</button>
</div>

<div class="box"><div id="plot2d"></div></div>
<div class="box"><div id="plot3d"></div></div>
<div class="box"><div id="track2d"></div></div>

<script>
let data = [];

class KalmanFilter {
    constructor() {
        this.Q_angle = 0.001;
        this.Q_bias = 0.003;
        this.R_measure = 0.03;

        this.angle = 0;
        this.bias = 0;
        this.P = [[0,0],[0,0]];
    }

    update(newAngle, newRate, dt) {
        // Prediction
        this.angle += dt * (newRate - this.bias);

        this.P[0][0] += dt * (dt*this.P[1][1] - this.P[0][1] - this.P[1][0] + this.Q_angle);
        this.P[0][1] -= dt * this.P[1][1];
        this.P[1][0] -= dt * this.P[1][1];
        this.P[1][1] += this.Q_bias * dt;

        // Update
        let S = this.P[0][0] + this.R_measure;
        let K0 = this.P[0][0] / S;
        let K1 = this.P[1][0] / S;

        let y = newAngle - this.angle;
        this.angle += K0 * y;
        this.bias += K1 * y;

        let P00 = this.P[0][0];
        let P01 = this.P[0][1];

        this.P[0][0] -= K0 * P00;
        this.P[0][1] -= K0 * P01;
        this.P[1][0] -= K1 * P00;
        this.P[1][1] -= K1 * P01;

        return this.angle;
    }
}

function applyKalmanFilter(){
    let kalmanRoll = new KalmanFilter();
    let kalmanPitch = new KalmanFilter();

    let rollArr = [];
    let pitchArr = [];
    let timeArr = [];

    for(let i=1;i<data.length;i++){
        let dt = data[i].time - data[i-1].time;
        if(dt <= 0 || dt > 0.1) dt = 0.016;

        // Accelerometer angle
        let rollAcc = Math.atan2(data[i].accY, data[i].accZ) * 180/Math.PI;
        let pitchAcc = Math.atan2(-data[i].accX,
                        Math.sqrt(data[i].accY**2 + data[i].accZ**2)) * 180/Math.PI;

        // Gyro rate (rad/s)
        let gyroRollRate = data[i].gyroX * 180/Math.PI;
        let gyroPitchRate = data[i].gyroY * 180/Math.PI;

        // Kalman
        let roll = kalmanRoll.update(rollAcc, gyroRollRate, dt);
        let pitch = kalmanPitch.update(pitchAcc, gyroPitchRate, dt);

        rollArr.push(roll);
        pitchArr.push(pitch);
        timeArr.push(data[i].time);
    }

    Plotly.newPlot('plot2d', [
        {x: timeArr, y: rollArr, name:'Roll (Kalman)'},
        {x: timeArr, y: pitchArr, name:'Pitch (Kalman)'}
    ], {
        title:'Kalman Filter Angle'
    });
}



function timeToSeconds(timeString){
    // Example input: "3/23/2026 4:39:12 PM"
    let timePart = timeString.split(' ')[1]; // "4:39:12"
    let ampm = timeString.split(' ')[2];     // "PM"

    let parts = timePart.split(':');
    let h = parseInt(parts[0]);
    let m = parseInt(parts[1]);
    let s = parseInt(parts[2]);

    if (ampm === "PM" && h !== 12) h += 12;
    if (ampm === "AM" && h === 12) h = 0;

    return h*3600 + m*60 + s;
}

document.getElementById('fileInput').addEventListener('change', function(e){
    let file = e.target.files[0];
    let reader = new FileReader();

    reader.onload = function(event){
        let lines = event.target.result.split('\n');
        data = [];

        for(let i=1;i<lines.length;i++){
            let row = lines[i].split(',');
            if(row.length >= 14){
                data.push({
                    time: parseFloat(row[0]) / 1000.0,
                    accX: parseFloat(row[1]),
                    accY: parseFloat(row[2]),
                    accZ: parseFloat(row[3]),
                    magX: parseFloat(row[4]),
                    magY: parseFloat(row[5]),
                    magZ: parseFloat(row[6]),
                    heading: parseFloat(row[7]),
                    pitch: parseFloat(row[8]),
                    roll: parseFloat(row[9]),
                    yaw: parseFloat(row[10]),
                    gyroX: parseFloat(row[11]),
                    gyroY: parseFloat(row[12]),
                    gyroZ: parseFloat(row[13])
                });
            }
        }
        alert("CSV Loaded");
    };
    reader.readAsText(file);
});

function plotMag(){
    Plotly.newPlot('plot2d', [
        {x: data.map(d=>d.time), y: data.map(d=>d.magX), name:'Mag X'},
        {x: data.map(d=>d.time), y: data.map(d=>d.magY), name:'Mag Y'},
        {x: data.map(d=>d.time), y: data.map(d=>d.magZ), name:'Mag Z'}
    ], {title:'Magnetometer'});
}

function plotAcc(){
    Plotly.newPlot('plot2d', [
        {x: data.map(d=>d.time), y: data.map(d=>d.accX), name:'Acc X'},
        {x: data.map(d=>d.time), y: data.map(d=>d.accY), name:'Acc Y'},
        {x: data.map(d=>d.time), y: data.map(d=>d.accZ), name:'Acc Z'}
    ], {title:'Acceleration'});
}

function plotHeading(){
    Plotly.newPlot('plot2d', [
        {x: data.map(d=>d.time), y: data.map(d=>d.heading), name:'Heading'}
    ], {title:'Heading vs Time'});
}

function plotMag3D(){
    Plotly.newPlot('plot3d', [{
        x: data.map(d=>d.magX),
        y: data.map(d=>d.magY),
        z: data.map(d=>d.magZ),
        mode: 'lines',
        type: 'scatter3d'
    }], {title:'3D Magnetometer'});
}

function plotAcc3D(){
    Plotly.newPlot('plot3d', [{
        x: data.map(d=>d.accX),
        y: data.map(d=>d.accY),
        z: data.map(d=>d.accZ),
        mode: 'lines',
        type: 'scatter3d'
    }], {title:'3D Acceleration'});
}

// Track reconstruction from heading (dead reckoning)
function plotTrack(){
    let x=[0], y=[0];
    let speed=0;

    // Bias removal
    let ax_bias=0;
    let sampleCount = 100;

    for(let i=0;i<sampleCount;i++){
        ax_bias += data[i].accX;
    }
    ax_bias /= sampleCount;

    for(let i=1;i<data.length;i++){
        let dt = data[i].time - data[i-1].time;
        if(dt <= 0 || dt > 0.1) dt = 0.016;

        let headingRad = data[i].heading * Math.PI/180;
        let accForward = data[i].accX - ax_bias;

        // integrate acceleration → speed
        speed += accForward * dt;

        // drag
        speed *= 0.995;

        // integrate speed → position
        let newX = x[i-1] + speed * dt * Math.sin(headingRad);
        let newY = y[i-1] + speed * dt * Math.cos(headingRad);

        x.push(newX);
        y.push(newY);
    }

    Plotly.newPlot('track2d', [{
        x:x,
        y:y,
        mode:'lines'
    }], {
        title:'2D Track (Speed + Heading)',
        xaxis:{title:'Meters'},
        yaxis:{title:'Meters', scaleanchor:"x"}
    });
}

function plotPosition3D(){
    let px=[0], py=[0], pz=[0];
    let vx=0, vy=0, vz=0;

    // ---- Bias removal ----
    let ax_bias=0, ay_bias=0, az_bias=0;
    let sampleCount = 100;

    for(let i=0;i<sampleCount;i++){
        ax_bias += data[i].accX;
        ay_bias += data[i].accY;
        az_bias += data[i].accZ;
    }
    ax_bias /= sampleCount;
    ay_bias /= sampleCount;
    az_bias /= sampleCount;

    for(let i=1;i<data.length;i++){
        let dt = data[i].time - data[i-1].time;
        let headingRad = data[i].heading * Math.PI/180;

        let accX = data[i].accX - ax_bias;
        let accY = data[i].accY - ay_bias;
        let accZ = data[i].accZ - az_bias;

        // Rotate to world frame
        let worldX = accX * Math.sin(headingRad);
        let worldY = accX * Math.cos(headingRad);
        let worldZ = accZ;

        // Integrate
        vx += worldX * dt;
        vy += worldY * dt;
        vz += worldZ * dt;

        // Zero velocity correction
        if(Math.abs(accX) < 0.05){
            vx *= 0.9;
            vy *= 0.9;
        }

        // Drag
        vx *= 0.995;
        vy *= 0.995;
        vz *= 0.995;

        px.push(px[i-1] + vx * dt);
        py.push(py[i-1] + vy * dt);
        pz.push(pz[i-1] + vz * dt);
    }

    Plotly.newPlot('plot3d', [{
        x: px,
        y: py,
        z: pz,
        mode: 'lines',
        type: 'scatter3d'
    }], {
        title:'3D Position (INS)'
    });
}

</script>

</body>
</html>
