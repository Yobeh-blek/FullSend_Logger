<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tire Temperature & Pressure</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h2>Tire Temperature & Pressure</h2>
  <a href="index.html">← Back to Dashboard</a>
  <canvas id="tireChart"></canvas>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    const laps = ['Lap 1', 'Lap 2', 'Lap 3'];
    const tempFL = [80, 90, 100];
    const tempFR = [82, 93, 98];

    new Chart(document.getElementById('tireChart'), {
      type: 'line',
      data: {
        labels: laps,
        datasets: [
          { label: 'Front Left Temp (°C)', data: tempFL, borderColor: 'red' },
          { label: 'Front Right Temp (°C)', data: tempFR, borderColor: 'orange' }
        ]
      }
    });
  </script>
</body>
</html>
