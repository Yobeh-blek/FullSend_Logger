<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Race Data Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bg-dark text-white py-4 mb-4">
    <div class="container">
      <h1 class="mb-0">Race Data Dashboard</h1>
    </div>
  </header>

  <div class="container">
    <div class="row mb-4 top-section">
      <div class="col-md-4 mb-3">
        <div class="card h-100 clickable" onclick="location.href='course.html'" role="button">
          <div class="card-body text-center">
            <h5 class="card-title">Course / Heading</h5>
            <div class="heading-indicator">
              <div class="arrow"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="col-md-4 mb-3">
        <div class="card h-100 clickable" onclick="location.href='lap.html'" role="button">
          <div class="card-body">
            <h5 class="card-title">Lap Times</h5>
            <ul class="list-unstyled">
              <li class="mb-2">Lap 3: <span class="badge bg-success">1:01.364s</span></li>
              <li class="mb-2">Lap 2: <span class="badge bg-success">1:01.364s</span></li>
              <li>Lap 1: <span class="badge bg-success">1:01.364s</span></li>
            </ul>
          </div>
        </div>
      </div>

      <div class="col-md-4 mb-3">
        <div class="card h-100 clickable" onclick="location.href='tire.html'" role="button">
          <div class="card-body">
            <h5 class="card-title">Tire Temperature & Pressure</h5>
            <div class="row g-2">
              <div class="col-6"><div class="alert alert-success mb-0 p-2"><small>Temp: 80°C<br>PSI: 28</small></div></div>
              <div class="col-6"><div class="alert alert-success mb-0 p-2"><small>Temp: 81°C<br>PSI: 28</small></div></div>
              <div class="col-6"><div class="alert alert-warning mb-0 p-2"><small>Temp: 95°C<br>PSI: 26</small></div></div>
              <div class="col-6"><div class="alert alert-danger mb-0 p-2"><small>Temp: 110°C<br>PSI: 24</small></div></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="row mb-4">
      <div class="col-12">
        <div class="card">
          <div class="card-body">
            <label for="fileInput" class="form-label"><strong>Browse Files:</strong></label>
            <input type="file" id="fileInput" class="form-control">
          </div>
        </div>
      </div>
    </div>

    <div class="row mb-4">
      <div class="col-md-6">
        <div class="card">
          <div class="card-header">
            <h5 class="mb-0">Time vs Distance</h5>
          </div>
          <div class="card-body">
            <canvas id="time vs distance"></canvas>
          </div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card">
          <div class="card-header">
            <h5 class="mb-0">Speed</h5>
          </div>
          <div class="card-body">
            <canvas id="speedChart vs distance"></canvas>
          </div>
        </div>
      </div>
    </div>

    <div class="row mb-4">
      <div class="col-md-6">
        <div class="card">
          <div class="card-header">
            <h5 class="mb-0">Brake</h5>
          </div>
          <div class="card-body">
            <canvas id="brakeChart vs distance"></canvas>
          </div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card">
          <div class="card-header">
            <h5 class="mb-0">Gas</h5>
          </div>
          <div class="card-body">
            <canvas id="gasChart vs distance"></canvas>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer class="bg-dark text-white text-center py-3 mt-5">
    <p class="mb-0">&copy; 2025 Race Data Dashboard</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    const labels = ['0m','1m','2m','3m','4m','5m'];

    function createChart(id, label, data, color) {
      new Chart(document.getElementById(id), {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: label,
            data: data,
            borderColor: color,
            fill: false,
          }]
        }
      });
    }

    createChart('time vs distance', 'Time', [0, 30, 10, 60, 40, 20], 'red');
    createChart('brakeChart vs distance', 'Brake', [20, 60, 90, 80, 100, 70], 'green');
    createChart('gasChart vs distance', 'Gas', [0, 40, 70, 100, 90, 80], 'blue');
    createChart('speedChart vs distance', 'Speed', [0, 15, 25, 30, 45, 60], 'blue');
  </script>
</body>
</html>
