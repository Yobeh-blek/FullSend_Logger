<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Lap Dashboard</title>
<style>
  body{margin:0;background:#0b0b0f;color:white;font-family:Segoe UI,Roboto,sans-serif;padding:20px}
  .backBtn{width:50px;height:50px;background:#0af;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:28px;cursor:pointer;user-select:none}
  .header{display:flex;align-items:center;gap:20px;margin-bottom:20px}
  .section{background:#111;border:2px solid #444;border-radius:16px;padding:20px;margin-bottom:20px}
  .graph{height:150px;background:#000;border-radius:12px;border:2px solid #333;display:flex;align-items:center;justify-content:center;margin-bottom:20px}
</style>
</head>
<body>
<div class="header">
  <div class="backBtn" id="closeTab">⟵</div>
  <h2 id="lapTitle">Lap Dashboard</h2>
</div>

<div class="section">
  <h3>Lap Time</h3>
  <div id="lapTimeBox" style="font-size:22px;font-weight:bold;color:#0f0;">--</div>
</div>

<div class="section">
  <h3>G-meter</h3>
  <div style="width:260px;height:260px;border-radius:130px;border:3px solid #777;position:relative;">
    <div id="gDot" style="width:20px;height:20px;background:red;border-radius:50%;position:absolute;left:120px;top:120px;"></div>
  </div>
</div>

<div class="section">
  <h3>Wheel Speed (RPM)</h3>
  <div id="wheelSpeedBox"></div>
</div>

<div class="section">
  <h3>Steering Wheel</h3>
  <div style="display:flex;gap:20px;">
    <div style="width:140px;height:140px;border-radius:70px;border:3px solid #777;display:flex;align-items:center;justify-content:center;font-size:48px;">↺</div>
    <div style="width:140px;height:140px;border-radius:70px;border:3px solid #777;display:flex;align-items:center;justify-content:center;font-size:48px;">↻</div>
  </div>
</div>

<div class="section">
  <h3>Sectors</h3>
  <div id="sectorBox"></div>
</div>

<div class="section">
  <h3>Graphs</h3>
  <div class="graph">Time vs Distance</div>
  <div class="graph">Brake vs Distance</div>
  <div class="graph">Gas vs Distance</div>
  <div class="graph">Speed vs Distance</div>
  <div class="graph">Tire Status vs Distance</div>
</div>

<script>
  document.getElementById('closeTab').onclick = ()=> window.close();
  const urlParams = new URLSearchParams(window.location.search);
  const lap = urlParams.get('lap');
  document.getElementById('lapTitle').textContent = `Lap ${lap} Dashboard`;
  
  // Display lap time from localStorage
  const lapTime = localStorage.getItem(`lap_${lap}_time`) || '--';
  const lapDifference = localStorage.getItem(`lap_${lap}_difference`) || '--';
  const displayText = lapDifference === '--' ? lapTime : `${lapTime} (${lapDifference > 0 ? '+' : ''}${lapDifference}s)`;
  document.getElementById('lapTimeBox').textContent = displayText;
  
  document.getElementById('wheelSpeedBox').innerHTML = localStorage.getItem(`lap_${lap}_speed`) || 'No data';
  document.getElementById('sectorBox').innerHTML = localStorage.getItem(`lap_${lap}_sectors`) || 'No sector data';
</script>

</body>
</html>
